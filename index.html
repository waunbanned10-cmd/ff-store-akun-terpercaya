<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FF MARKET - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --neon-orange: #ff4d00;
            --neon-red: #ff0040;
            --neon-blue: #00e5ff;
            --neon-purple: #b829dd;
            --dark-bg: #0a0a0f;
            --card-bg: #111118;
            --text: #e0e0e0;
            --text-dim: #6b6b7b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--dark-bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 3px);
            opacity: 0.5;
        }

        .bg-glow {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(255,77,0,0.03) 0%, transparent 70%);
            animation: rotateGlow 30s linear infinite;
            z-index: -1;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            z-index: 1;
        }

        .auth-box {
            background: var(--card-bg);
            border: 1px solid rgba(255, 77, 0, 0.08);
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .auth-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-orange), var(--neon-red), transparent);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-logo .icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--neon-orange), var(--neon-red));
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 0 30px rgba(255, 77, 0, 0.2);
            margin-bottom: 10px;
        }

        .auth-logo h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--neon-orange), var(--neon-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-logo p {
            color: var(--text-dim);
            font-size: 0.8rem;
            margin-top: 2px;
        }

        .auth-tabs {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .auth-tab.active {
            background: rgba(255, 77, 0, 0.12);
            color: var(--neon-orange);
            box-shadow: 0 0 20px rgba(255, 77, 0, 0.05);
        }

        .auth-tab:active { transform: scale(0.95); }

        .auth-form {
            display: none;
            animation: fadeSlide 0.3s ease;
        }

        .auth-form.active {
            display: block;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .form-group label .req {
            color: var(--neon-red);
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--neon-orange);
            box-shadow: 0 0 20px rgba(255, 77, 0, 0.05);
        }

        .form-group input::placeholder {
            color: var(--text-dim);
            opacity: 0.3;
        }

        .form-group input.input-otp {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 8px;
            padding: 14px;
        }

        .form-group .otp-hint {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.7rem;
            margin-top: 4px;
            opacity: 0.5;
        }

        .form-group .otp-hint strong {
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            opacity: 1;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--neon-orange), var(--neon-red));
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            margin-top: 4px;
        }

        .btn-submit:active { transform: scale(0.97); }
        .btn-submit:hover { box-shadow: 0 4px 25px rgba(255, 77, 0, 0.2); }
        .btn-submit:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-submit i { margin-right: 6px; }

        .btn-submit.blue {
            background: linear-gradient(135deg, var(--neon-blue), #0088ff);
        }
        .btn-submit.blue:hover { box-shadow: 0 4px 25px rgba(0, 229, 255, 0.2); }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--text-dim);
            font-size: 0.75rem;
        }

        .auth-footer a {
            color: var(--neon-orange);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-footer a:active { opacity: 0.7; }

        .error-msg {
            color: var(--neon-red);
            font-size: 0.75rem;
            text-align: center;
            margin-top: 10px;
            display: none;
            padding: 8px 12px;
            background: rgba(255, 0, 64, 0.06);
            border-radius: 8px;
            border: 1px solid rgba(255, 0, 64, 0.08);
        }

        .error-msg.show { display: block; }

        .success-msg {
            color: var(--neon-blue);
            font-size: 0.75rem;
            text-align: center;
            margin-top: 10px;
            display: none;
            padding: 8px 12px;
            background: rgba(0, 229, 255, 0.04);
            border-radius: 8px;
            border: 1px solid rgba(0, 229, 255, 0.06);
        }

        .success-msg.show { display: block; }

        .password-toggle {
            position: relative;
        }

        .password-toggle input {
            padding-right: 44px;
        }

        .password-toggle .toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
        }

        .password-toggle .toggle-btn:active { opacity: 0.6; }

        .otp-timer {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.7rem;
            margin-top: 8px;
        }

        .otp-timer span {
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
        }

        @media (max-width: 480px) {
            .auth-box { padding: 24px 18px; }
            .auth-logo .icon { width: 44px; height: 44px; font-size: 1.2rem; }
            .auth-logo h1 { font-size: 1.1rem; }
            .form-group input.input-otp { font-size: 1.1rem; letter-spacing: 6px; }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="bg-glow"></div>

    <div class="auth-container">
        <div class="auth-box">
            <!-- Logo -->
            <div class="auth-logo">
                <div class="icon"><i class="fas fa-fire"></i></div>
                <h1>FF MARKET</h1>
                <p>Trusted Marketplace • Jual Beli Akun FF</p>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')" id="tabLogin">
                    <i class="fas fa-sign-in-alt" style="margin-right:4px;"></i> Login
                </button>
                <button class="auth-tab" onclick="switchTab('register')" id="tabRegister">
                    <i class="fas fa-user-plus" style="margin-right:4px;"></i> Register
                </button>
            </div>

            <!-- Error Message -->
            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>

            <!-- ============ LOGIN FORM ============ -->
            <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email <span class="req">*</span></label>
                    <input type="email" id="loginEmail" placeholder="email@gmail.com" required autocomplete="email">
                </div>

                <div class="form-group password-toggle">
                    <label>Password <span class="req">*</span></label>
                    <input type="password" id="loginPass" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="toggle-btn" onclick="togglePass('loginPass')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <!-- OTP Field -->
                <div class="form-group">
                    <label>Kode OTP <span class="req">*</span></label>
                    <input type="text" class="input-otp" id="loginOtp" placeholder="927 370" maxlength="7" required
                           oninput="this.value=this.value.replace(/\D/g,'').slice(0,6); formatOtp(this)">
                    <div class="otp-hint">Gunakan kode: <strong>927370</strong></div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-arrow-right"></i> Login
                </button>

                <div class="auth-footer">
                    Belum punya akun? <a onclick="switchTab('register')">Register</a>
                </div>
            </form>

            <!-- ============ REGISTER FORM ============ -->
            <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Email <span class="req">*</span></label>
                    <input type="email" id="regEmail" placeholder="email@gmail.com" required autocomplete="email">
                </div>

                <div class="form-group password-toggle">
                    <label>Password <span class="req">*</span></label>
                    <input type="password" id="regPass" placeholder="Min 6 karakter" required minlength="6" autocomplete="new-password">
                    <button type="button" class="toggle-btn" onclick="togglePass('regPass')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <div class="form-group password-toggle">
                    <label>Konfirmasi Password <span class="req">*</span></label>
                    <input type="password" id="regPassConfirm" placeholder="Ulangi password" required minlength="6" autocomplete="new-password">
                    <button type="button" class="toggle-btn" onclick="togglePass('regPassConfirm')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <!-- OTP Field -->
                <div class="form-group">
                    <label>Kode OTP <span class="req">*</span></label>
                    <input type="text" class="input-otp" id="regOtp" placeholder="927 370" maxlength="7" required
                           oninput="this.value=this.value.replace(/\D/g,'').slice(0,6); formatOtp(this)">
                    <div class="otp-hint">Gunakan kode: <strong>927370</strong></div>
                </div>

                <button type="submit" class="btn-submit blue">
                    <i class="fas fa-user-plus"></i> Register
                </button>

                <div class="auth-footer">
                    Sudah punya akun? <a onclick="switchTab('login')">Login</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============ CONFIG ============
        const OTP_CODE = '927370'; // OTP STATIS untuk semua email
        const USERS_KEY = 'ffm_users';

        // ============ STATE ============
        let users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];

        // ============ UTILITY ============
        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('show');
            document.getElementById('successMsg').classList.remove('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.classList.add('show');
            document.getElementById('errorMsg').classList.remove('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        function togglePass(id) {
            const input = document.getElementById(id);
            const btn = input.parentElement.querySelector('.toggle-btn i');
            if (input.type === 'password') {
                input.type = 'text';
                btn.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                btn.className = 'fas fa-eye';
            }
        }

        function formatOtp(input) {
            const val = input.value.replace(/\s/g, '');
            if (val.length > 3) {
                input.value = val.slice(0, 3) + ' ' + val.slice(3);
            } else {
                input.value = val;
            }
        }

        // ============ TAB SWITCH ============
        function switchTab(tab) {
            document.getElementById('errorMsg').classList.remove('show');
            document.getElementById('successMsg').classList.remove('show');

            // Tabs
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            if (tab === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
                document.getElementById('registerForm').classList.remove('active');
            } else {
                document.getElementById('tabRegister').classList.add('active');
                document.getElementById('registerForm').classList.add('active');
                document.getElementById('loginForm').classList.remove('active');
            }
        }

        // ============ VALIDATE OTP ============
        function validateOtp(input) {
            const otp = input.replace(/\s/g, '');
            return otp === OTP_CODE;
        }

        // ============ REGISTER ============
        function handleRegister(e) {
            e.preventDefault();

            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const pass = document.getElementById('regPass').value;
            const passConfirm = document.getElementById('regPassConfirm').value;
            const otp = document.getElementById('regOtp').value;

            // Validate OTP
            if (!validateOtp(otp)) {
                showError('❌ Kode OTP salah! Gunakan 927370');
                return;
            }

            // Validate email
            if (!email || !email.includes('@') || !email.includes('.')) {
                showError('❌ Email tidak valid!');
                return;
            }

            // Validate password
            if (pass.length < 6) {
                showError('❌ Password minimal 6 karakter!');
                return;
            }

            if (pass !== passConfirm) {
                showError('❌ Password tidak sama!');
                return;
            }

            // Check if user exists
            if (users.find(u => u.email === email)) {
                showError('❌ Email sudah terdaftar!');
                return;
            }

            // Save user
            users.push({
                email: email,
                password: pass,
                createdAt: new Date().toISOString()
            });

            localStorage.setItem(USERS_KEY, JSON.stringify(users));

            showSuccess('✅ Registrasi berhasil! Silakan login.');

            // Reset form
            document.getElementById('registerForm').reset();

            // Switch to login after 1.5s
            setTimeout(() => {
                switchTab('login');
                document.getElementById('loginEmail').value = email;
            }, 1500);
        }

        // ============ LOGIN ============
        function handleLogin(e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const pass = document.getElementById('loginPass').value;
            const otp = document.getElementById('loginOtp').value;

            // Validate OTP
            if (!validateOtp(otp)) {
                showError('❌ Kode OTP salah! Gunakan 927370');
                return;
            }

            // Find user
            const user = users.find(u => u.email === email && u.password === pass);

            if (!user) {
                showError('❌ Email atau password salah!');
                return;
            }

            showSuccess('✅ Login berhasil! Mengalihkan...');

            // Save session
            sessionStorage.setItem('ffm_session', JSON.stringify({
                email: email,
                loginTime: new Date().toISOString()
            }));

            // Redirect to main page after 1s
            setTimeout(() => {
                window.location.href = 'marketplace.html';
            }, 1000);
        }

        // ============ AUTO-FILL OTP DEMO ============
        // Bisa dihapus, ini cuma buat demo biar cepat
        document.addEventListener('DOMContentLoaded', () => {
            // Set default OTP for demo
            const loginOtp = document.getElementById('loginOtp');
            const regOtp = document.getElementById('regOtp');

            // Auto fill OTP on focus (demo convenience)
            loginOtp.addEventListener('focus', function() {
                if (!this.value) {
                    this.value = '927 370';
                }
            });

            regOtp.addEventListener('focus', function() {
                if (!this.value) {
                    this.value = '927 370';
                }
            });

            // Pre-fill demo account
            if (users.length === 0) {
                // Create demo account for testing
                users.push({
                    email: 'demo@email.com',
                    password: 'demodemo',
                    createdAt: new Date().toISOString()
                });
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
            }
        });

        // ============ CHECK SESSION ============
        // Jika sudah login, redirect ke marketplace
        const session = sessionStorage.getItem('ffm_session');
        if (session) {
            try {
                const data = JSON.parse(session);
                if (data.email && data.loginTime) {
                    // Already logged in, redirect
                    window.location.href = 'marketplace.html';
                }
            } catch (e) {}
        }

        // ============ KEYBOARD SHORTCUT ============
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const active = document.querySelector('.auth-form.active');
                if (active) {
                    const submit = active.querySelector('.btn-submit');
                    if (submit) submit.click();
                }
            }
        });
    </script>
</body>
</html>
