<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FF MARKET - Profil</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --neon-orange: #ff4d00;
            --neon-red: #ff0040;
            --neon-blue: #00e5ff;
            --dark-bg: #0a0a0f;
            --card-bg: #111118;
            --text: #e0e0e0;
            --text-dim: #6b6b7b;
        }

        body {
            background: var(--dark-bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 3px);
            opacity: 0.5;
        }

        .profile-container {
            max-width: 500px;
            margin: 0 auto;
        }

        .profile-card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid rgba(255, 77, 0, 0.08);
            padding: 28px 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-orange), var(--neon-red), transparent);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-orange), var(--neon-red));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 12px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 3px solid rgba(255, 77, 0, 0.2);
            transition: all 0.3s;
        }

        .profile-avatar:hover {
            border-color: var(--neon-orange);
            box-shadow: 0 0 30px rgba(255, 77, 0, 0.15);
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-avatar .edit-avatar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.75);
            padding: 6px;
            font-size: 0.6rem;
            text-align: center;
            color: #fff;
            opacity: 0;
            transition: opacity 0.3s;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .profile-avatar:hover .edit-avatar {
            opacity: 1;
        }

        .profile-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .profile-username {
            color: var(--text-dim);
            font-size: 0.8rem;
            margin-bottom: 2px;
        }

        .profile-email {
            color: var(--text-dim);
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .profile-stats {
            display: flex;
            justify-content: space-around;
            padding: 16px 0;
            border-top: 1px solid rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--neon-orange);
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            transition: all 0.2s;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--neon-orange);
            box-shadow: 0 0 20px rgba(255,77,0,0.05);
        }

        .form-group input::placeholder, .form-group textarea::placeholder {
            color: var(--text-dim);
            opacity: 0.3;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--neon-orange), var(--neon-red));
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit:active { transform: scale(0.97); }
        .btn-submit:hover { box-shadow: 0 4px 20px rgba(255,77,0,0.2); }

        .btn-submit.blue {
            background: linear-gradient(135deg, var(--neon-blue), #0088ff);
        }
        .btn-submit.blue:hover { box-shadow: 0 4px 20px rgba(0,229,255,0.2); }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 16px;
            cursor: pointer;
            transition: color 0.2s;
            padding: 8px 0;
        }

        .btn-back:hover { color: var(--text); }
        .btn-back:active { transform: scale(0.97); }

        .toast-stack {
            position: fixed;
            top: 70px;
            right: 12px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 320px;
            width: 100%;
            pointer-events: none;
        }

        .toast {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateX(120%);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            pointer-events: auto;
        }

        .toast.show { transform: translateX(0); }
        .toast.success { border-color: rgba(0,229,255,0.15); }
        .toast.success i { color: var(--neon-blue); }
        .toast.error { border-color: rgba(255,0,64,0.15); }
        .toast.error i { color: var(--neon-red); }

        .toast i { font-size: 1rem; flex-shrink: 0; }
        .toast span { font-size: 0.8rem; font-weight: 500; }

        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .action-row .btn-submit { flex: 2; }
        .action-row .btn-submit.blue { flex: 1; }

        @media (max-width: 480px) {
            .profile-card { padding: 20px 16px; }
            .profile-avatar { width: 80px; height: 80px; font-size: 2rem; }
            .profile-name { font-size: 1rem; }
            .stat-number { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div class="toast-stack" id="toastStack"></div>

    <div class="profile-container">
        <a class="btn-back" onclick="window.location.href='marketplace.html'">
            <i class="fas fa-arrow-left"></i> Kembali ke Marketplace
        </a>

        <div class="profile-card">
            <!-- Header -->
            <div class="profile-header">
                <div class="profile-avatar" id="avatarArea" onclick="document.getElementById('avatarInput').click()">
                    <img id="avatarPreview" src="" alt="Avatar">
                    <div class="edit-avatar"><i class="fas fa-camera"></i> Ganti Foto</div>
                    <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(this)">
                </div>
                <div class="profile-name" id="displayName">User</div>
                <div class="profile-username" id="displayUsername">@username</div>
                <div class="profile-email" id="displayEmail">email@email.com</div>
            </div>

            <!-- Stats -->
            <div class="profile-stats">
                <div class="stat-item">
                    <div class="stat-number" id="statProducts">0</div>
                    <div class="stat-label">Produk</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="statRequests">0</div>
                    <div class="stat-label">Request</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="statSales">0</div>
                    <div class="stat-label">Terjual</div>
                </div>
            </div>

            <!-- Form -->
            <form id="profileForm" onsubmit="updateProfile(event)">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="fullName" placeholder="Nama kamu">
                </div>

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="@username">
                </div>

                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="bio" placeholder="Ceritakan tentang kamu..."></textarea>
                </div>

                <div class="form-group">
                    <label>WhatsApp</label>
                    <input type="text" id="profileWA" placeholder="08123456789">
                </div>

                <div class="action-row">
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-save" style="margin-right:6px;"></i> Simpan Profil
                    </button>
                    <button type="button" class="btn-submit blue" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </form>

            <div style="margin-top:16px;padding:10px 14px;background:rgba(255,0,64,0.04);border-radius:10px;border:1px solid rgba(255,0,64,0.06);">
                <p style="color:var(--text-dim);font-size:0.65rem;text-align:center;">
                    <i class="fas fa-shield-alt" style="color:var(--neon-orange);margin-right:4px;"></i>
                    Akun aman dengan sistem MC
                </p>
            </div>
        </div>
    </div>

    <script>
        // ============ CONFIG ============
        const SESSION_KEY = 'ffm_session';
        const PROFILE_KEY = 'ffm_profile';
        const USERS_KEY = 'ffm_users';

        // ============ CHECK SESSION ============
        function checkSession() {
            const session = sessionStorage.getItem(SESSION_KEY);
            if (!session) {
                window.location.href = 'index.html';
                return null;
            }
            try {
                const data = JSON.parse(session);
                if (!data.email) {
                    window.location.href = 'index.html';
                    return null;
                }
                return data;
            } catch (e) {
                window.location.href = 'index.html';
                return null;
            }
        }

        const session = checkSession();
        if (session) {
            document.getElementById('displayEmail').textContent = session.email;

            // Load profile
            const profile = JSON.parse(localStorage.getItem(PROFILE_KEY)) || {};
            document.getElementById('fullName').value = profile.fullName || '';
            document.getElementById('username').value = profile.username || '';
            document.getElementById('bio').value = profile.bio || '';
            document.getElementById('profileWA').value = profile.wa || '';
            document.getElementById('displayName').textContent = profile.fullName || session.email.split('@')[0];
            document.getElementById('displayUsername').textContent = profile.username ? '@' + profile.username : '@username';

            if (profile.avatar) {
                document.getElementById('avatarPreview').src = profile.avatar;
            }
        }

        // ============ STATS ============
        function loadStats() {
            const products = JSON.parse(localStorage.getItem('ffm_products')) || [];
            const needs = JSON.parse(localStorage.getItem('ffm_needs')) || [];
            document.getElementById('statProducts').textContent = products.length;
            document.getElementById('statRequests').textContent = needs.length;

            // Demo sales - bisa dihitung dari produk yang sudah terjual
            const sales = JSON.parse(localStorage.getItem('ffm_sales')) || [];
            document.getElementById('statSales').textContent = sales.length || Math.floor(Math.random() * 5);
        }
        loadStats();

        // ============ AVATAR ============
        function handleAvatarUpload(input) {
            const file = input.files[0];
            if (!file) return;
            if (file.size > 2 * 1024 * 1024) { showToast('Max 2MB!', 'error'); return; }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById('avatarPreview');
                img.src = e.target.result;
                // Save to profile
                const profile = JSON.parse(localStorage.getItem(PROFILE_KEY)) || {};
                profile.avatar = e.target.result;
                localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
                showToast('Avatar diperbarui! ✅', 'success');
            };
            reader.readAsDataURL(file);
        }

        // ============ UPDATE PROFILE ============
        function updateProfile(e) {
            e.preventDefault();

            const profile = {
                fullName: document.getElementById('fullName').value.trim(),
                username: document.getElementById('username').value.trim(),
                bio: document.getElementById('bio').value.trim(),
                wa: document.getElementById('profileWA').value.trim()
            };

            // Keep existing avatar
            const existing = JSON.parse(localStorage.getItem(PROFILE_KEY)) || {};
            if (existing.avatar) {
                profile.avatar = existing.avatar;
            }

            localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
            document.getElementById('displayName').textContent = profile.fullName || session.email.split('@')[0];
            document.getElementById('displayUsername').textContent = profile.username ? '@' + profile.username : '@username';
            showToast('Profil diperbarui! ✅', 'success');
        }

        // ============ LOGOUT ============
        function logout() {
            if (confirm('Yakin mau logout?')) {
                sessionStorage.removeItem(SESSION_KEY);
                window.location.href = 'index.html';
            }
        }

        // ============ TOAST ============
        function showToast(msg, type = 'success') {
            const stack = document.getElementById('toastStack');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-times-circle'}"></i><span>${msg}</span>`;
            stack.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }
    </script>
</body>
</html>
